version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits prefix so PR titles pass the commit-lint check
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
